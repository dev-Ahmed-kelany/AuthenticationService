<div class="min-h-screen bg-slate-50 flex">
  <!-- Sidebar -->
  <aside class="w-64 bg-slate-900 text-white flex flex-col fixed inset-y-0 left-0 shadow-xl">
    <!-- Brand -->
    <div class="px-6 py-6">
      <div class="flex items-center gap-3">
        <div
          class="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-lg shadow-sm"
        >
          AK
        </div>

        <div>
          <h1 class="text-sm font-semibold text-white">Authentication</h1>

          <p class="text-xs text-slate-400">Service</p>
        </div>
      </div>
    </div>

    <!-- Separator -->
    <div class="px-5">
      <div class="h-px bg-slate-700"></div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-4 py-6 space-y-2">
      <!-- Dashboard -->
      <button
        type="button"
        routerLink="./"
        routerLinkActive="bg-blue-600 text-white shadow-sm"
        [routerLinkActiveOptions]="{ exact: true }"
        class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition"
      >
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 12l9-9 9 9
               M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10"
          />
        </svg>

        <span>Dashboard</span>
      </button>

      <!-- Users -->
      <button
        type="button"
        routerLink="users"
        routerLinkActive="bg-blue-600 text-white shadow-sm"
        class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition"
      >
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M17 20h5v-2
               a4 4 0 00-4-4h-1
               M9 20H4v-2
               a4 4 0 014-4h1
               M12 12
               a4 4 0 100-8
               4 4 0 000 8z
               M16 3.13
               a4 4 0 010 7.75"
          />
        </svg>

        <span>Users</span>
      </button>

      <!-- Roles -->
      <button
        type="button"
        routerLink="roles"
        routerLinkActive="bg-blue-600 text-white shadow-sm"
        class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition"
      >
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 2l7 4v6
               c0 5-3 8-7 10
               c-4-2-7-5-7-10V6l7-4z
               M9 12l2 2 4-4"
          />
        </svg>

        <span>Roles</span>
      </button>

      <!-- Permissions -->
      <button
        type="button"
        routerLink="permissions"
        routerLinkActive="bg-blue-600 text-white shadow-sm"
        class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition"
      >
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 7a3 3 0 11-6 0
               3 3 0 016 0z
               M5 21a7 7 0 0114 0
               M17 11l2 2 4-4"
          />
        </svg>

        <span>Permissions</span>
      </button>

      <!-- Profile -->
      <button
        type="button"
        routerLink="profile"
        routerLinkActive="bg-blue-600 text-white shadow-sm"
        class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition"
      >
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M20 21a8 8 0 00-16 0
               M12 13a4 4 0 100-8
               4 4 0 000 8z"
          />
        </svg>

        <span>Profile</span>
      </button>

      <!-- Login History -->
      <button
        type="button"
        routerLink="login-history"
        routerLinkActive="bg-blue-600 text-white shadow-sm"
        class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition"
      >
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 8v4l3 2
               M21 12a9 9 0 11-18 0
               9 9 0 0118 0z"
          />
        </svg>

        <span>Login History</span>
      </button>

      <!-- Audit Logs -->
      <button
        type="button"
        routerLink="audit-logs"
        routerLinkActive="bg-blue-600 text-white shadow-sm"
        class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition"
      >
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 12h6
               M9 16h6
               M9 8h6
               M5 4h14a2 2 0 012 2v12
               a2 2 0 01-2 2H5
               a2 2 0 01-2-2V6
               a2 2 0 012-2z"
          />
        </svg>

        <span>Audit Logs</span>
      </button>
    </nav>

    <!-- Logout -->
    <div class="px-4 pb-5">
      <div class="h-px bg-slate-700 mb-4"></div>

      <button
        type="button"
        (click)="logout()"
        class="w-full flex items-center justify-center gap-3 px-4 py-3 rounded-lg bg-red-600 text-white text-sm font-semibold hover:bg-red-700 active:bg-red-800 transition focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 focus:ring-offset-slate-900"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 12H3
               M3 12l4-4
               M3 12l4 4
               M15 4h4a2 2 0 012 2v12
               a2 2 0 01-2 2h-4"
          />
        </svg>

        <span>Logout</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="ml-64 flex-1 min-h-screen">
    <div class="p-8">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

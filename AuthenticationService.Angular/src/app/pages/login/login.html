<div class="min-h-screen bg-slate-50 flex items-center justify-center px-4 py-8">
  <div class="w-full max-w-md">
    <!-- Brand -->
    <div class="text-center mb-8">
      <div
        class="mx-auto mb-4 w-14 h-14 rounded-xl bg-blue-600 text-white flex items-center justify-center text-2xl font-bold shadow-sm"
      >
        AK
      </div>

      <h1 class="text-2xl font-bold text-slate-900">Authentication Service</h1>

      <p class="mt-2 text-sm text-slate-500">Sign in to access your account</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-7">
      <div class="mb-6">
        <h2 class="text-xl font-semibold text-slate-900">Welcome back</h2>

        <p class="mt-1 text-sm text-slate-500">Enter your credentials to continue.</p>
      </div>

      <!-- Error Message -->
      <div
        class="hidden mb-5 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
      >
        <div class="flex items-start gap-3">
          <span class="font-semibold">!</span>

          <div>
            <p class="font-medium">Login failed</p>

            <p class="mt-1 text-red-600">Invalid username or password.</p>
          </div>
        </div>
      </div>

      <!-- Username -->
      <div class="mb-5">
        <label for="username" class="block mb-2 text-sm font-medium text-slate-700">
          Username
        </label>

        <div class="relative">
          <div
            class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 pointer-events-none"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0z
                   M12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
          </div>

          <input
            id="username"
            type="text"
            [(ngModel)]="username"
            placeholder="Enter your username"
            class="w-full rounded-lg border border-slate-300 bg-white py-2.5 pl-10 pr-4 text-sm text-slate-900 placeholder-slate-400 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          />
        </div>
      </div>

      <!-- Password -->
      <div class="mb-6">
        <div class="flex items-center justify-between mb-2">
          <label for="password" class="text-sm font-medium text-slate-700"> Password </label>
        </div>

        <div class="relative">
          <div
            class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 pointer-events-none"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6
                   a2 2 0 00-2-2H6a2 2 0 00-2 2v6
                   a2 2 0 002 2zm10-10V7
                   a4 4 0 00-8 0v4h8z"
              />
            </svg>
          </div>

          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Enter your password"
            [(ngModel)]="password"
            class="w-full rounded-lg border border-slate-300 bg-white py-2.5 pl-10 pr-11 text-sm text-slate-900 placeholder-slate-400 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          />

          <button
            type="button"
            (click)="showPassword = !showPassword"
            class="absolute inset-y-0 right-0 flex items-center px-3 text-slate-400 hover:text-slate-600 transition"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            @if (showPassword) {
              <!-- Eye Off -->
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3 3l18 18
           M10.6 10.6a2 2 0 102.8 2.8
           M9.9 4.2A10.5 10.5 0 0112 4
           c5 0 8.7 4.5 9.8 6
           a1.8 1.8 0 010 1.9
           c-.5.8-1.4 2-2.8 3.1
           M6.2 6.2C4.5 7.3 3.2 8.9 2.2 10
           a1.8 1.8 0 000 1.9
           C3.3 13.5 7 18 12 18
           c1.1 0 2.1-.2 3-.5"
                />
              </svg>
            } @else {
              <!-- Eye -->
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M2.5 12s3.5-6 9.5-6
           9.5 6 9.5 6
           s-3.5 6-9.5 6
           -9.5-6-9.5-6z
           M12 15a3 3 0 100-6
           3 3 0 000 6z"
                />
              </svg>
            }
          </button>
        </div>
      </div>

      <!-- Login Button -->
      <button
        type="button"
        (click)="login()"
        class="w-full rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700 active:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
      >
        Sign In
      </button>

      <!-- Footer -->
      <div class="mt-6 text-center">
        <p class="text-xs text-slate-400">Authentication Service</p>
      </div>
    </div>
  </div>
</div>
